name: Grand Shop - build candidate only

# DRAFT: committing this file to fix-black-image starts a build and GHCR push.
# No RunPod API calls, GPU jobs, endpoint updates, or main-branch changes.
on:
  push:
    branches: [fix-black-image]
    paths: [.github/workflows/build-grandshop-candidate.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: grandshop-qwen-candidate
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hamedasssi-ctrl/qwen_image_edit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 0d9f53944e38cf451cc0f175b27d09ccf9d31042
      BASE_IMAGE: registry.runpod.net/wlsdml1114-qwen-image-edit-main-dockerfile:d1ae8b705
      IMAGE_NAME: ghcr.io/hamedasssi-ctrl/qwen-image-edit
    steps:
      - name: Checkout the reviewed handler revision
        uses: actions/checkout@v4
        with:
          ref: 0d9f53944e38cf451cc0f175b27d09ccf9d31042
          persist-credentials: false

      - name: Validate source and prepare isolated build context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m py_compile handler.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          w = json.loads(Path("workflow/qwen_image_edit_1_1image.json").read_text())
          assert w["78"]["class_type"] == "LoadImage"
          assert w["111"]["class_type"] == "TextEncodeQwenImageEditPlus"
          assert w["60"]["class_type"] == "SaveImage"
          assert w["3"]["inputs"]["steps"] == 4
          assert w["3"]["inputs"]["cfg"] == 1
          assert w["93"]["inputs"]["megapixels"] == 1
          assert sum(n["class_type"] == "LoadImage" for n in w.values()) == 1
          source = Path("handler.py").read_text()
          assert "BLACK_OUTPUT" in source and "validate=True" in source
          print("Source compiles; single-image workflow matches the reviewed configuration.")
          PY
          mkdir -p candidate-context
          cp handler.py candidate-context/handler.py
          sha256sum candidate-context/handler.py
          cat > candidate-context/Dockerfile <<'DOCKER'
          # syntax=docker/dockerfile:1
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          COPY --link --chmod=0644 handler.py /handler.py
          WORKDIR /
          CMD ["/entrypoint.sh"]
          DOCKER

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve and pin the current base image digest
        id: base
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$BASE_IMAGE" > base-manifest.txt
          cat base-manifest.txt
          digest="$(awk '$1 == "Digest:" {print $2; exit}' base-manifest.txt)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=${BASE_IMAGE}@$digest" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_NAME}:candidate-0d9f539-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and store a separate candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./candidate-context
          file: ./candidate-context/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          tags: ${{ steps.base.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/hamedasssi-ctrl/qwen_image_edit
            org.opencontainers.image.revision=0d9f53944e38cf451cc0f175b27d09ccf9d31042
            org.opencontainers.image.title=Grand Shop Qwen diagnostic candidate

      - name: Record the candidate and approval boundary
        env:
          CANDIDATE_TAG: ${{ steps.base.outputs.tag }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          PINNED_BASE: ${{ steps.base.outputs.ref }}
        shell: bash
        run: |
          {
            echo "### Candidate built; GPU quality test still required"
            echo "- Image: $CANDIDATE_TAG"
            echo "- Immutable image: ${IMAGE_NAME}@$CANDIDATE_DIGEST"
            echo "- Base: $PINNED_BASE"
            echo "- Source: $SOURCE_SHA"
            echo "- Existing RunPod endpoint and Release 1 were not changed."
            echo "- No GPU test was submitted."
            echo "- Do not deploy or change package visibility without approval."
          } >> "$GITHUB_STEP_SUMMARY"
