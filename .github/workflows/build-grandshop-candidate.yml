name: Grand Shop - build candidate only

# Reuses the runtime built in run 43949736361; never deploys or calls RunPod.
on:
  push:
    branches: [fix-black-image]
    paths: [.github/workflows/build-grandshop-candidate.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: grandshop-qwen-candidate
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hamedasssi-ctrl/qwen_image_edit'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: 0d9f53944e38cf451cc0f175b27d09ccf9d31042
      RUNTIME_REF: ghcr.io/hamedasssi-ctrl/qwen-image-edit@sha256:66ca813816da30d8f9a448af895a46b97af1314810a87c8bde87fee3787cd0b7
      IMAGE_NAME: ghcr.io/hamedasssi-ctrl/qwen-image-edit
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6
        with:
          ref: 0d9f53944e38cf451cc0f175b27d09ccf9d31042
          persist-credentials: false

      - name: Install pinned crane from the official release
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/google/go-containerregistry/releases/download/v0.22.1
          curl --fail --location --silent --show-error --retry 3 "$url/go-containerregistry_Linux_x86_64.tar.gz" -o "$RUNNER_TEMP/crane.tar.gz"
          mkdir -p "$RUNNER_TEMP/crane-bin"
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/crane-bin" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/crane-bin/crane" version

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add and validate the four original model files
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, struct, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          source = pathlib.Path('Dockerfile').read_text()
          models = re.findall(r'RUN wget -q (\S+) -O (\S+)', source)
          assert len(models) == 4, 'Expected exactly four original model files'
          image = os.environ['IMAGE_NAME']
          base = os.environ['RUNTIME_REF']
          original = json.loads(run('crane', 'config', base))
          assert original['architecture'] == 'amd64' and original['os'] == 'linux'
          assert 'entrypoint.sh' in ' '.join(original['config'].get('Cmd', []))
          original_layers = json.loads(run('crane', 'manifest', base))['layers']
          records = []
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'grandshop-model-layer'
          root.mkdir()
          for index, (url, dest) in enumerate(models, 1):
              assert url.startswith('https://huggingface.co/')
              assert dest.startswith('/ComfyUI/models/') and '..' not in dest
              assert dest.endswith('.safetensors')
              assert shutil.disk_usage(root).free > 45 * 1024**3, 'Insufficient free disk space'
              payload = root / 'payload'
              target = payload / dest.lstrip('/')
              target.parent.mkdir(parents=True)
              print(f'Downloading model {index}/4: {dest}', flush=True)
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error', '--retry', '3', '--connect-timeout', '30', url, '-o', str(target)], check=True)
              size = target.stat().st_size
              with target.open('rb') as f:
                  header_size = struct.unpack('<Q', f.read(8))[0]
                  assert 0 < header_size < 100_000_000, 'Invalid safetensors header'
                  header = json.loads(f.read(header_size))
              tensors = [v for k, v in header.items() if k != '__metadata__']
              assert tensors and max(t['data_offsets'][1] for t in tensors) == size - 8 - header_size, 'Incomplete model download'
              digest = hashlib.sha256()
              with target.open('rb') as f:
                  for block in iter(lambda: f.read(8 * 1024**2), b''):
                      digest.update(block)
              target.chmod(0o644)
              records.append({'path': dest, 'url': url, 'bytes': size, 'sha256': digest.hexdigest()})
              print(f'Validated {size} bytes; SHA256 {digest.hexdigest()}', flush=True)
              layer = root / 'model.tar.gz'
              with layer.open('wb') as out:
                  tar = subprocess.Popen(['tar', '--owner=0', '--group=0', '--numeric-owner', '-C', str(payload), '-cf', '-', 'ComfyUI'], stdout=subprocess.PIPE)
                  gzip = subprocess.run(['gzip', '-1'], stdin=tar.stdout, stdout=out)
                  tar.stdout.close()
                  assert gzip.returncode == 0 and tar.wait() == 0, 'Layer packaging failed'
              tag = f"{image}:stage-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-model{index}"
              if index == 4:
                  tag = f"{image}:candidate-{os.environ['SOURCE_SHA'][:7]}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
              print(f'Publishing model {index}/4 without downloading parent layers', flush=True)
              subprocess.run(['crane', 'append', '--base', base, '--new_layer', str(layer), '--new_tag', tag], check=True)
              base = f"{image}@{run('crane', 'digest', tag)}"
              print(f'Saved model {index}/4: {base}', flush=True)
              shutil.rmtree(payload)
              layer.unlink()
          final = json.loads(run('crane', 'config', base))
          assert final['config'] == original['config'], 'Runtime configuration changed'
          manifest = json.loads(run('crane', 'manifest', base))
          assert manifest['layers'][:len(original_layers)] == original_layers
          assert len(manifest['layers']) == len(original_layers) + 4
          report = {'tag': tag, 'ref': base, 'source': os.environ['SOURCE_SHA'], 'runtime': os.environ['RUNTIME_REF'], 'models': records, 'gpu_test': 'NOT_RUN', 'runpod_changed': False}
          pathlib.Path('candidate-build-report.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={tag}\nref={base}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### Grand Shop candidate built; GPU quality test still required\n\n')
              out.write(f'- Image: `{tag}`\n- Immutable image: `{base}`\n')
              out.write(f"- Source: `{os.environ['SOURCE_SHA']}`\n")
              out.write('- Four model files validated; runtime configuration preserved.\n')
              out.write('- Existing RunPod endpoint and Release 1 were not changed. No GPU job submitted.\n\n')
              out.write('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          print(f'Candidate image: {tag}\nImmutable image: {base}', flush=True)
          PY
